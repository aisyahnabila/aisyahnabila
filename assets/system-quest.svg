<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">System Quest: Trace the Bug</title>
  <desc id="desc">A game map following a requirement from chaos through analysis, documentation, and testing to a verified system, with bug obstacles along the way.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1d3440" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#07131a" flood-opacity=".55"/>
    </filter>
    <style>
      .mono { font-family: 'Courier New', monospace; }
      .label { fill: #d9f0e6; font: 700 16px 'Courier New', monospace; letter-spacing: 1px; }
      .small { fill: #93b8b8; font: 13px 'Courier New', monospace; letter-spacing: .5px; }
      .zone { fill: #07151d; stroke: #31515a; stroke-width: 2; }
      .wall { fill: #152d36; stroke: #27444e; stroke-width: 2; }
      .path { fill: none; stroke: #5ed2b0; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
      .branch { fill: none; stroke: #d1a85a; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 8 10; opacity: .8; }
    </style>
  </defs>

  <rect width="1200" height="720" rx="18" fill="#061018"/>
  <rect x="18" y="18" width="1164" height="684" rx="12" fill="url(#grid)" stroke="#294851" stroke-width="2"/>

  <g class="mono">
    <text x="52" y="62" fill="#5ed2b0" font-size="18" font-weight="700" letter-spacing="3">SYSTEM QUEST</text>
    <text x="52" y="88" class="small">TRACE THE BUG / ROUTE THE REQUIREMENT</text>
    <text x="830" y="59" class="small">LEVEL 04 / SYSTEM ANALYSIS</text>
    <text x="830" y="84" fill="#5ed2b0" font-size="14" font-weight="700">STATUS: STABLE</text>
    <text x="1010" y="84" class="small">[██████░░] 75%</text>
  </g>

  <!-- maze walls -->
  <g>
    <rect class="wall" x="72" y="152" width="116" height="22" rx="5"/><rect class="wall" x="72" y="174" width="22" height="94" rx="5"/>
    <rect class="wall" x="242" y="128" width="22" height="96" rx="5"/><rect class="wall" x="264" y="128" width="110" height="22" rx="5"/>
    <rect class="wall" x="410" y="184" width="118" height="22" rx="5"/><rect class="wall" x="506" y="206" width="22" height="82" rx="5"/>
    <rect class="wall" x="648" y="126" width="22" height="104" rx="5"/><rect class="wall" x="670" y="208" width="116" height="22" rx="5"/>
    <rect class="wall" x="840" y="144" width="22" height="96" rx="5"/><rect class="wall" x="862" y="218" width="138" height="22" rx="5"/>
    <rect class="wall" x="134" y="382" width="22" height="108" rx="5"/><rect class="wall" x="156" y="468" width="106" height="22" rx="5"/>
    <rect class="wall" x="322" y="354" width="132" height="22" rx="5"/><rect class="wall" x="432" y="376" width="22" height="98" rx="5"/>
    <rect class="wall" x="588" y="404" width="22" height="108" rx="5"/><rect class="wall" x="610" y="490" width="120" height="22" rx="5"/>
    <rect class="wall" x="800" y="372" width="22" height="108" rx="5"/><rect class="wall" x="822" y="458" width="124" height="22" rx="5"/>
    <rect class="wall" x="1004" y="392" width="22" height="104" rx="5"/>
  </g>

  <!-- main route with deliberate turns -->
  <path id="mainroute" class="path" d="M104 314 H206 V252 H326 V296 H438 V338 H566 V286 H704 V326 H822 V292 H958 V332 H1080 V554 H948 V604 H780 V566 H644 V616 H488 V556 H350 V602 H214 V546 H104 V426 H196 V374 H286"/>
  <path class="branch" d="M438 338 V440 H516 V516 H568"/>
  <path class="branch" d="M822 292 V176 H922"/>

  <!-- player marker: rides the START -> ANALYSIS -> DOCUMENTATION -> TESTING
       leg of mainroute (the first ~52% of its length, where the path already
       threads through all three zones in order), holds briefly once it
       reaches the finish node, then resets. Drawn under the zone cards so it
       ducks out of sight while "inside" each stage instead of riding over
       their labels. -->
  <g filter="url(#glow)">
    <circle cx="0" cy="0" r="13" fill="#f3d37a" stroke="#fff1b0" stroke-width="3"/>
    <circle cx="0" cy="0" r="25" fill="none" stroke="#f3d37a" opacity=".3" stroke-width="2"/>
    <animateMotion dur="12s" repeatCount="indefinite" rotate="0" calcMode="linear" keyTimes="0;0.75;1" keyPoints="0;0.523;0.523">
      <mpath href="#mainroute"/>
    </animateMotion>
  </g>

  <!-- start node -->
  <g filter="url(#soft)">
    <circle cx="104" cy="314" r="37" fill="#102b31" stroke="#5ed2b0" stroke-width="3"/>
    <circle cx="104" cy="314" r="9" fill="#5ed2b0" filter="url(#glow)"/>
  </g>
  <text x="64" y="382" class="label">START</text>
  <text x="55" y="401" class="small">RAW INPUT</text>

  <!-- analysis zone -->
  <g filter="url(#soft)"><rect class="zone" x="210" y="232" width="166" height="92" rx="12" stroke="#5ed2b0"/></g>
  <circle cx="240" cy="267" r="16" fill="none" stroke="#5ed2b0" stroke-width="4"/><path d="M251 279l13 13" stroke="#5ed2b0" stroke-width="4" stroke-linecap="round"/>
  <text x="272" y="262" class="label">LEVEL 01</text><text x="272" y="284" class="label">ANALYSIS</text><text x="229" y="307" class="small">MAP THE NEED</text>

  <!-- documentation zone -->
  <g filter="url(#soft)"><rect class="zone" x="535" y="238" width="190" height="96" rx="12" stroke="#d1a85a"/></g>
  <rect x="562" y="263" width="25" height="32" rx="3" fill="none" stroke="#d1a85a" stroke-width="3"/><path d="M568 273h13M568 281h13M568 289h9" stroke="#d1a85a" stroke-width="2"/>
  <text x="603" y="270" class="label">LEVEL 02</text><text x="603" y="292" class="label">DOCUMENTATION</text><text x="560" y="316" class="small">MAKE IT CLEAR</text>

  <!-- testing zone -->
  <g filter="url(#soft)"><rect class="zone" x="770" y="276" width="166" height="94" rx="12" stroke="#e08172"/></g>
  <path d="M798 300h24l-3 8v24a8 8 0 0 1-8 8h-2a8 8 0 0 1-8-8v-24z" fill="none" stroke="#e08172" stroke-width="3"/><path d="M795 300h30M803 314h14" stroke="#e08172" stroke-width="3"/>
  <text x="838" y="309" class="label">LEVEL 03</text><text x="838" y="331" class="label">TESTING</text><text x="796" y="353" class="small">FIND + VERIFY</text>

  <!-- finish node -->
  <g filter="url(#soft)">
    <rect x="930" y="522" width="184" height="76" rx="12" fill="#12372f" stroke="#5ed2b0" stroke-width="3"/>
    <circle cx="965" cy="560" r="18" fill="none" stroke="#5ed2b0" stroke-width="2">
      <animate attributeName="r" values="18;30;18" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".55;0;.55" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="965" cy="560" r="18" fill="#5ed2b0"/>
    <path d="M956 560l7 7 13-16" fill="none" stroke="#061018" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="994" y="555" class="label">SYSTEM VERIFIED</text><text x="994" y="578" fill="#5ed2b0" font-size="13" font-weight="700">QUEST COMPLETE</text>

  <!-- bugs; the first sits directly on mainroute so it visibly blocks the path -->
  <g fill="#e08172" stroke="#061018" stroke-width="3">
    <g transform="translate(405 296)">
      <animateTransform attributeName="transform" type="scale" values="1;1.14;1" additive="sum" dur="1.9s" repeatCount="indefinite" begin="0s"/>
      <ellipse cx="0" cy="0" rx="12" ry="15"/><circle cx="0" cy="-17" r="7"/><path d="M-10 -5l-13-8M-11 3l-14 2M10 -5l13-8M11 3l14 2" fill="none" stroke="#e08172" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g transform="translate(622 386)">
      <animateTransform attributeName="transform" type="scale" values="1;1.14;1" additive="sum" dur="1.9s" repeatCount="indefinite" begin="0.6s"/>
      <ellipse cx="0" cy="0" rx="12" ry="15"/><circle cx="0" cy="-17" r="7"/><path d="M-10 -5l-13-8M-11 3l-14 2M10 -5l13-8M11 3l14 2" fill="none" stroke="#e08172" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g transform="translate(902 418)">
      <animateTransform attributeName="transform" type="scale" values="1;1.14;1" additive="sum" dur="1.9s" repeatCount="indefinite" begin="1.2s"/>
      <ellipse cx="0" cy="0" rx="12" ry="15"/><circle cx="0" cy="-17" r="7"/><path d="M-10 -5l-13-8M-11 3l-14 2M10 -5l13-8M11 3l14 2" fill="none" stroke="#e08172" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
  <text x="372" y="340" class="small" fill="#e08172">BUG</text><text x="602" y="430" class="small" fill="#e08172">BUG</text><text x="882" y="462" class="small" fill="#e08172">BUG</text>

  <!-- Baymax-like quiet companion -->
  <g transform="translate(1065 176)" opacity=".8">
    <circle cx="0" cy="8" r="32" fill="none" stroke="#d9f0e6" stroke-width="2">
      <animate attributeName="r" values="30;42;30" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.32;0" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <rect x="-25" y="-20" width="50" height="58" rx="25" fill="#d9f0e6" stroke="#7ca9a0" stroke-width="2"/>
    <circle cx="-9" cy="0" r="3" fill="#31515a"/><circle cx="9" cy="0" r="3" fill="#31515a"/><path d="M-9 0h18" stroke="#31515a" stroke-width="2"/>
    <path d="M-31 5h-13M31 5h13M-10 38v13M10 38v13" stroke="#7ca9a0" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="1024" y="246" class="small">ASSIST</text>

  <text x="52" y="670" class="small">OBJECTIVE: TRACE THE BUG  /  KEEP THE REQUIREMENT MOVING</text>
  <text x="1002" y="670" class="small">v1.0</text>
</svg>
